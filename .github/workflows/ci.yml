name: CI Pipeline

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Code Formatting (Ruff)
        run: ruff format --check .

      - name: Lint Codebase (Ruff)
        run: ruff check .

  tests-and-migrations:
    name: Tests & Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amrutam_telemedicine_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_NAME: "Amrutam Telemedicine API"
      APP_ENV: "test"
      DEBUG: "false"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@localhost:5432/amrutam_telemedicine_test"
      DATABASE_TEST_URL: "postgresql+asyncpg://postgres:postgrespassword@localhost:5432/amrutam_telemedicine_test"
      SECRET_KEY: "ci-insecure-test-secret-key-minimum-32-chars-long!"
      MFA_ENCRYPTION_KEY: "MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      METRICS_ENABLED: "true"
      TRACING_ENABLED: "true"
      RATE_LIMIT_BACKEND: "memory"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply Database Migrations (Alembic)
        run: alembic upgrade head

      - name: Run Test Suite (Pytest)
        run: pytest -v

  security-scans:
    name: Security Scans & Vulnerability Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7.0"

      - name: Audit Dependencies for Known Vulnerabilities (pip-audit)
        run: pip-audit

      - name: Verify No Secrets or Environment Files Tracked in Git
        run: |
          echo "Scanning git repository for committed secrets and .env files..."
          MATCHED_FILES=$(git ls-files | grep -E '^\.env$|^\.env\..+|.*\.pem$|.*\.key$' || true)
          if [ -n "$MATCHED_FILES" ]; then
            echo "ERROR: Tracked secret or environment files detected:"
            echo "$MATCHED_FILES"
            exit 1
          fi
          echo "No tracked credentials or .env files detected."

      - name: Secret Scanning (TruffleHog OSS)
        uses: trufflesecurity/trufflehog@v3.88.15
        with:
          extra_args: --only-verified

  container-build:
    name: Container Build & Hardening Verification
    runs-on: ubuntu-latest
    needs: [code-quality, tests-and-migrations]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: amrutam-telemedicine:ci
          load: true

      - name: Verify Non-Root User Execution
        run: |
          USER_ID=$(docker run --rm amrutam-telemedicine:ci id -u)
          GROUP_ID=$(docker run --rm amrutam-telemedicine:ci id -g)
          echo "Container runtime UID: $USER_ID, GID: $GROUP_ID"
          if [ "$USER_ID" -eq 0 ]; then
            echo "ERROR: Container runtime must run as unprivileged user, but runs as root (UID 0)!"
            exit 1
          fi
          if [ "$USER_ID" -ne 10001 ]; then
            echo "WARNING: Expected UID 10001 (appuser), found UID $USER_ID"
          fi

      - name: Verify No .env Files Included in Container
        run: |
          echo "Inspecting container filesystem for accidental .env leakage..."
          FOUND_ENV=$(docker run --rm amrutam-telemedicine:ci sh -c "find /app -name '.env*' 2>/dev/null" || true)
          if [ -n "$FOUND_ENV" ]; then
            echo "ERROR: Found .env file(s) baked into container image:"
            echo "$FOUND_ENV"
            exit 1
          fi
          echo "Container image verified free of .env files."

      - name: Verify Container Health Check Configuration
        run: |
          HEALTHCHECK=$(docker inspect --format='{{json .Config.Healthcheck}}' amrutam-telemedicine:ci)
          echo "Inspected healthcheck: $HEALTHCHECK"
          if ! echo "$HEALTHCHECK" | grep -q "health/live"; then
            echo "ERROR: Health check does not target /health/live!"
            exit 1
          fi
          echo "Health check configuration verified."
